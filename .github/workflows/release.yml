name: Release

# Publishes an unofficial build of the plugin as a GitHub release of this repository.
# Official releases are published by jenkinsci/proxmox-plugin.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.8.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]*$'; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rename artifact as unofficial
        run: |
          for f in target/*.hpi; do
            mv "$f" "${f%.hpi}_unofficial.hpi"
          done

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "## Proxmox Plugin v$VERSION (Unofficial)"
            echo ""
            echo "> **Note:** This is an unofficial release. For official releases, see [jenkinsci/proxmox-plugin](https://github.com/jenkinsci/proxmox-plugin)."
            echo ""
            echo "### Changes"
            if [ -n "$previous" ]; then
              git log --pretty=format:"- %s" "$previous"..HEAD | head -30
            else
              git log --pretty=format:"- %s" -20
            fi
            echo ""
            echo ""
            echo "### Installation"
            echo "Download the \`.hpi\` file and install it via Jenkins > Manage Jenkins > Plugins > Advanced settings > Deploy Plugin."
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Proxmox Plugin v${{ steps.version.outputs.version }} (Unofficial)
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            target/*.hpi
          fail_on_unmatched_files: true
