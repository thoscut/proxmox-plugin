name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Rename artifact as unofficial
        if: matrix.java == 21
        run: cp target/proxmox.hpi target/proxmox_unofficial.hpi

      - name: Upload plugin
        if: matrix.java == 21
        uses: actions/upload-artifact@v5
        with:
          name: proxmox_unofficial
          path: target/proxmox_unofficial.hpi
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore
